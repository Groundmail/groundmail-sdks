[package]
name = "groundmail"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Official Rust client for the Groundmail transactional email API"
license = "MIT"
repository = "https://github.com/Groundmail/groundmail-sdks"
homepage = "https://groundmail.dev"
documentation = "https://docs.groundmail.dev/sdks/rust"
readme = "README.md"
keywords = ["email", "transactional", "api", "webhooks", "groundmail"]
categories = ["email", "api-bindings", "web-programming::http-client"]

[dependencies]
hex = "0.4"
hmac = "0.12"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
